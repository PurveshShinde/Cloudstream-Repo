name: Sync and Build Repository

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-repo.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'build-repo'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Unit Tests
        run: npm test

      - name: Build Repository & Catalog
        env:
          REPO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/builds
        run: npm run build

      - name: Deploy to builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: dist
          clean: true
          commit-message: 'Automated Sync: Update plugins and repo manifest [skip ci]'

